<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>kidsnews v2 · brand audit</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Nunito', system-ui, sans-serif; color: #1b1230; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="kn-shared.jsx"></script>
<script type="text/babel" src="kn-screens-before.jsx"></script>
<script type="text/babel" src="kn-screens-after.jsx"></script>
<script type="text/babel" src="kn-flow-pick3.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

// — Build a BEFORE/AFTER pair of artboards. Returns an array (NOT a wrapper
// component) so DCSection can see them as direct children.
function pair({ idBase, width, height, before, after, beforeNotes = [], afterNotes = [] }) {
  return [
    <DCArtboard key={`${idBase}-before`} id={`${idBase}-before`} label="BEFORE · live in code" width={width} height={height}>
      <div style={{position:'relative', width:'100%', height:'100%', background:'#fff', overflow:'hidden'}}>
        <Stamp kind="before"/>
        {before}
        {beforeNotes.map((n, i) => <Note key={i} {...n}/>)}
      </div>
    </DCArtboard>,
    <DCArtboard key={`${idBase}-after`} id={`${idBase}-after`} label="AFTER · brand-aligned" width={width} height={height}>
      <div style={{position:'relative', width:'100%', height:'100%', background:'#fff', overflow:'hidden'}}>
        <Stamp kind="after"/>
        {after}
        {afterNotes.map((n, i) => <Note key={i} {...n}/>)}
      </div>
    </DCArtboard>,
  ];
}

// Header pair sits on a cream backdrop so the bottom border reads clearly.
const headerPair = () => pair({
  idBase: 'header',
  width: 1180,
  height: 140,
  before: <HeaderBefore/>,
  after: <HeaderAfter/>,
  beforeNotes: [
    { kind:'fix', top: 70, left: 28, children: <>Placeholder logo "Oh,Ye!" — generic newspaper-with-face mascot, not part of the locked 21mins family.</> },
    { kind:'fix', top: 70, left: 320, children: <>Wordmark "News Oh,Ye!" doesn't connect to the parent brand. No 21mins endorsement anywhere.</> },
  ],
  afterNotes: [
    { kind:'new',  top: 78, left: 28, children: <>Locked sun-face mark + "kidsnews" wordmark. "a 21mins channel" endorsement uses the parent 21 mark at 11px.</> },
    { kind:'new',  top: 78, left: 360, children: <>Vertical-switcher pill primes the channel system: ai · finance · tech are dimmed siblings, ready to ship.</> },
  ],
});

const heroPair = () => pair({
  idBase: 'hero',
  width: 1180,
  height: 460,
  before: <HomeHeroBefore/>,
  after: <HomeHeroAfter/>,
  beforeNotes: [
    { kind:'fix', top: 60, left: 32, children: <><b>"15 minutes"</b> contradicts the parent brand's "21mins" promise. The hero is the loudest place to break the rule.</> },
    { kind:'fix', top: 200, left: 32, children: <>No tagline. The "Little daily, big magic" line that anchors 21mins doesn't appear anywhere.</> },
    { kind:'fix', top: 60, right: 32, children: <>"5 min" per story × 3 = 15 — math is locked to the wrong total.</> },
  ],
  afterNotes: [
    { kind:'new', top: 60, left: 32, children: <><b>"21 minutes"</b> in the headline. 7 min × 3 stories = 21 — the math now reinforces the brand.</> },
    { kind:'new', top: 220, left: 32, children: <>Tagline lands in italic Fraunces, coral — the same treatment used on the parent brand sheet.</> },
    { kind:'keep', top: 60, right: 32, children: <>Daily-3 stack pattern works well; just retuned counts and added a "done" check on completed stories.</> },
  ],
});

const gridPair = () => pair({
  idBase: 'grid',
  width: 1180,
  height: 1100,
  before: <HomeGridBefore/>,
  after: <HomeGridBefore/>,
  beforeNotes: [
    { kind:'keep', top: 30, left: 32, children: <>Category tabs and card grid are working — colors, radii, shadow-on-block all consistent with the parent visual system.</> },
  ],
  afterNotes: [
    { kind:'keep', top: 30, left: 32, children: <>No changes here. The feed grid is the strongest part of the v2 design and ports forward unchanged.</> },
  ],
});

const articlePair = () => pair({
  idBase: 'article',
  width: 1180,
  height: 900,
  before: <ArticleReaderBefore/>,
  after: <ArticleReaderAfter/>,
  beforeNotes: [
    { kind:'fix', top: 30, left: 220, children: <>Top bar still shows "News Oh,Ye!" — same wordmark issue as the home header.</> },
    { kind:'fix', top: 240, left: 32, children: <>Time-to-read shown as "7 min" in isolation. No connection to the user's "21 minutes today" budget.</> },
  ],
  afterNotes: [
    { kind:'new',  top: 30, left: 220, children: <>Compact kidsnews lockup replaces "Oh,Ye!" — same hierarchy, brand-aligned.</> },
    { kind:'new',  top: 240, left: 32, children: <>Time pill now reads "7 min · 1 of your 21" — every story is positioned as a chunk of the daily 21.</> },
    { kind:'keep', top: 30, right: 32, children: <>Stage stepper (Read · Background · Quiz · Think) is genuinely good — kept as-is.</> },
  ],
});

function PanelPair() {
  return (
    <DCSection id="panel" title="3 · User panel · brand watermark + 21-min goal" subtitle="Drawer hero">
      <DCArtboard id="panel-before" label="BEFORE · live in code" width={460} height={580}>
        <div style={{position:'relative', width:'100%', height:'100%', background:'#fff', display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
          <Stamp kind="before"/>
          <UserPanelBefore/>
        </div>
      </DCArtboard>
      <DCArtboard id="panel-after" label="AFTER · brand-aligned" width={460} height={580}>
        <div style={{position:'relative', width:'100%', height:'100%', background:'#fff', display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
          <Stamp kind="after"/>
          <UserPanelAfter/>
        </div>
      </DCArtboard>
      <DCArtboard id="panel-notes" label="What changed" width={400} height={580}>
        <div style={{padding:'24px 22px', fontFamily:'Nunito, sans-serif', fontSize:13, lineHeight:1.55, color:'#1b1230'}}>
          <div style={{fontFamily:'Fraunces, serif', fontWeight:700, fontSize:22, marginBottom:14, letterSpacing:'-0.02em'}}>3 changes</div>
          <ol style={{paddingLeft:18, margin:0, display:'flex', flexDirection:'column', gap:14}}>
            <li><b>Sun-rays watermark</b> in the hero header — same DNA as the kidsnews mark, low-opacity. Quietly brands every drawer open.</li>
            <li><b>Daily goal options</b> retuned to <b>15 / 21 / 30 / 45</b>. 21 is pre-selected with a coral "BRAND" tag — makes the brand math the obvious default.</li>
            <li><b>Streak chip</b> uses ink + gold instead of generic white pill — same color pair as the parent badge.</li>
          </ol>
        </div>
      </DCArtboard>
    </DCSection>
  );
}

// — New surfaces (no BEFORE; these don't exist in v2 yet)
function NewSurfaces() {
  return (
    <DCSection id="new" title="4 · Net-new surfaces · onboarding, favicon, OG" subtitle="kidsnews v2 has none of these today">
      <DCArtboard id="onboarding" label="NEW · First-run onboarding" width={920} height={580}>
        <div style={{position:'relative', width:'100%', height:'100%', background:'#fff', display:'flex', alignItems:'center', justifyContent:'center'}}>
          <div style={{position:'absolute', top: 14, left: 14, zIndex: 4, background: '#ffc83d', color: '#1b1230', padding: '6px 12px', borderRadius: 999, fontFamily:'Nunito, sans-serif', fontWeight: 900, fontSize: 11, letterSpacing: '.14em', boxShadow: '0 2px 0 rgba(27,18,48,0.15)'}}>NEW</div>
          <OnboardingNew/>
        </div>
      </DCArtboard>
      <DCArtboard id="favicon" label="NEW · Favicon + tab" width={500} height={140}>
        <div style={{padding: '20px', display:'flex', flexDirection:'column', justifyContent:'flex-end', height:'100%'}}>
          <FaviconPreview/>
        </div>
      </DCArtboard>
      <DCArtboard id="og" label="NEW · Open Graph share card" width={640} height={400}>
        <div style={{padding: 20, display:'flex', alignItems:'center', justifyContent:'center', height:'100%'}}>
          <OGCard/>
        </div>
      </DCArtboard>
    </DCSection>
  );
}

// — Cover: a brief intro card that orients the reviewer
function Cover() {
  return (
    <DCSection id="cover" title="kidsnews v2 · brand audit" subtitle="Recreating each surface, then fixing it against the locked 21mins brand">
      <DCArtboard id="cover-card" label="Read me first" width={640} height={420}>
        <div style={{
          padding: '40px 36px', height:'100%', background: 'linear-gradient(135deg, #ffe2a8 0%, #ffc0a8 100%)',
          display:'flex', flexDirection:'column', justifyContent:'space-between',
        }}>
          <div>
            <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:14}}>
              <Mark21 size={14} ink={KN.ink} accent={KN.ink}/>
              <span style={{fontSize:11, fontWeight:900, color: KN.ink, letterSpacing:'.18em', textTransform:'uppercase'}}>21mins · brand audit</span>
            </div>
            <div style={{fontFamily:'Fraunces, serif', fontWeight:700, fontSize:42, color: KN.ink, letterSpacing:'-0.025em', lineHeight:1.0, marginBottom:10}}>
              kids<span style={{color: KN.coral}}>news</span> v2
            </div>
            <div style={{fontFamily:'Fraunces, serif', fontWeight:600, fontStyle:'italic', fontSize:20, color:'#c14e2a', marginBottom:18, letterSpacing:'-0.015em'}}>
              Where the existing build hits the locked brand — and where it doesn't.
            </div>
            <div style={{fontSize:14, color:'#3a2a4a', lineHeight:1.55, maxWidth:420}}>
              Each section pairs a faithful rebuild of v2's current screen <b>(BEFORE)</b> with a brand-aligned correction <b>(AFTER)</b>. Annotations call out what changes, what stays, and what's net-new.
            </div>
          </div>
          <div style={{display:'flex', gap:16, fontSize:11, fontWeight:800, color: KN.ink, letterSpacing:'.06em', textTransform:'uppercase', borderTop:'1.5px solid rgba(27,18,48,0.2)', paddingTop:14}}>
            <span><span style={{color: KN.coral}}>●</span> Change</span>
            <span><span style={{color:'#17b3a6'}}>●</span> Keep</span>
            <span><span style={{color:'#d89b4a'}}>●</span> New</span>
          </div>
        </div>
      </DCArtboard>
      <DCArtboard id="brand-recap" label="The locked brand (recap)" width={420} height={420}>
        <div style={{padding: '32px 28px', height:'100%', background: KN.cream, display:'flex', flexDirection:'column', gap: 18}}>
          <div style={{display:'flex', alignItems:'center', gap: 14}}>
            <MarkKids size={64}/>
            <div>
              <div style={{fontFamily:'Fraunces, serif', fontWeight:700, fontSize:26, color: KN.ink, letterSpacing:'-0.02em', lineHeight:1}}>kids<span style={{color: KN.coral}}>news</span></div>
              <div style={{display:'flex', alignItems:'center', gap:6, marginTop:6}}>
                <Mark21 size={11} ink={KN.muted} accent={KN.muted}/>
                <span style={{fontSize:10, fontWeight:800, color: KN.muted, letterSpacing:'.18em', textTransform:'uppercase'}}>a 21mins channel</span>
              </div>
            </div>
          </div>
          <div style={{fontFamily:'Fraunces, serif', fontWeight:600, fontStyle:'italic', fontSize:22, color:'#c14e2a', letterSpacing:'-0.015em', lineHeight:1.1}}>
            Little daily,<br/>big magic.
          </div>
          <div style={{borderTop:`1.5px solid ${KN.border}`, paddingTop: 14, fontSize: 12.5, lineHeight: 1.6, color:'#3a2a4a'}}>
            <b>The five locks:</b><br/>
            1. Sun-face mark with 12 rays<br/>
            2. "kidsnews" wordmark, coral "news"<br/>
            3. "a 21mins channel" endorsement<br/>
            4. <b>21</b> minutes daily — never 15<br/>
            5. Tagline: "Little daily, big magic"
          </div>
        </div>
      </DCArtboard>
    </DCSection>
  );
}

// — Section 5 · pick-3 flow
function FlowArrow() {
  return (
    <svg width="60" height="60" viewBox="0 0 60 60" style={{flexShrink: 0, alignSelf:'center'}}>
      <path d="M 8 30 L 48 30 M 38 20 L 50 30 L 38 40" stroke="#1b1230" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function FlowSection() {
  return (
    <DCSection id="flow" title="5 · Proposed flow · pick → today → read" subtitle="Reframe home as an active ritual: the kid curates their 21 minutes, then reads. Replaces the simultaneous hero+feed of v2.">
      <DCArtboard id="flow-rationale" label="Why this flow" width={420} height={780}>
        <div style={{padding:'32px 28px', height:'100%', background: KN.cream, fontFamily:'Nunito, sans-serif', fontSize:13, lineHeight:1.55, color: KN.ink}}>
          <div style={{fontFamily:'Fraunces, serif', fontWeight:700, fontSize:26, marginBottom:14, letterSpacing:'-0.02em', lineHeight:1.05}}>The reframe</div>
          <div style={{fontFamily:'Fraunces, serif', fontStyle:'italic', fontWeight:600, fontSize:16, color:'#c14e2a', marginBottom:20, letterSpacing:'-0.01em'}}>Magic comes from kids choosing — not algorithms feeding.</div>
          <div style={{borderTop:`1.5px solid ${KN.border}`, paddingTop:18, display:'flex', flexDirection:'column', gap:14}}>
            <div>
              <div style={{fontWeight:900, fontSize:11, color: KN.coral, letterSpacing:'.1em', textTransform:'uppercase', marginBottom:4}}>The tension in v2</div>
              <div>The home page shows a curated Daily-3 <i>and</i> a browsable feed. They compete — if the 3 are picked for me, why is the feed there? If the feed matters, why do I need the 3?</div>
            </div>
            <div>
              <div style={{fontWeight:900, fontSize:11, color:'#17b3a6', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:4}}>The proposal</div>
              <div>Make picking the daily 3 the <b>job of the home screen</b>. Categories become a filter for picking, not nav chrome. The feed-as-browser drops in priority.</div>
            </div>
            <div>
              <div style={{fontWeight:900, fontSize:11, color:'#d89b4a', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:4}}>What it earns</div>
              <ul style={{margin:'4px 0 0', paddingLeft:18, display:'flex', flexDirection:'column', gap:6}}>
                <li><b>Ritual</b>. Picking is a 30-second daily decision — a habit hook before the read habit.</li>
                <li><b>Ownership</b>. The 3 are <i>theirs</i>, not the algorithm's.</li>
                <li><b>Brand fit</b>. "Little daily, big magic" reads as the kid's act, not the product's.</li>
                <li><b>Math is honest</b>. 6 + 7 + 8 = 21. Times shown on cards add up before they tap Start.</li>
              </ul>
            </div>
            <div>
              <div style={{fontWeight:900, fontSize:11, color: KN.muted, letterSpacing:'.1em', textTransform:'uppercase', marginBottom:4}}>Open questions</div>
              <ul style={{margin:'4px 0 0', paddingLeft:18, display:'flex', flexDirection:'column', gap:6}}>
                <li>What's in the pool? 9 stories/day from the editor? More?</li>
                <li>Can a kid skip picking and get a default 3? (Yes — "Surprise me" button.)</li>
                <li>Does the old feed stay accessible? (Yes, behind "View all stories".)</li>
                <li>What if they pick 4? (Pick replaces oldest — always exactly 3.)</li>
              </ul>
            </div>
          </div>
        </div>
      </DCArtboard>
      <DCArtboard id="flow-pick" label="1 · Pick — 'Choose your 3'" width={1180} height={780}>
        <div style={{position:'relative', width:'100%', height:'100%'}}>
          <div style={{position:'absolute', top:14, left:14, zIndex:4, background:'#ffc83d', color:'#1b1230', padding:'6px 12px', borderRadius:999, fontFamily:'Nunito, sans-serif', fontWeight:900, fontSize:11, letterSpacing:'.14em', boxShadow:'0 2px 0 rgba(27,18,48,0.15)'}}>STEP 1</div>
          <PickScreen/>
        </div>
      </DCArtboard>
      <DCArtboard id="flow-today" label="2 · Today — 'Locked in'" width={1180} height={780}>
        <div style={{position:'relative', width:'100%', height:'100%'}}>
          <div style={{position:'absolute', top:14, left:14, zIndex:4, background:'#ffc83d', color:'#1b1230', padding:'6px 12px', borderRadius:999, fontFamily:'Nunito, sans-serif', fontWeight:900, fontSize:11, letterSpacing:'.14em', boxShadow:'0 2px 0 rgba(27,18,48,0.15)'}}>STEP 2</div>
          <TodayScreen/>
        </div>
      </DCArtboard>
      <DCArtboard id="flow-read" label="3 · Read — first story" width={1180} height={780}>
        <div style={{position:'relative', width:'100%', height:'100%', overflow:'hidden'}}>
          <div style={{position:'absolute', top:14, left:14, zIndex:4, background:'#ffc83d', color:'#1b1230', padding:'6px 12px', borderRadius:999, fontFamily:'Nunito, sans-serif', fontWeight:900, fontSize:11, letterSpacing:'.14em', boxShadow:'0 2px 0 rgba(27,18,48,0.15)'}}>STEP 3</div>
          <ReadScreen/>
        </div>
      </DCArtboard>
    </DCSection>
  );
}

function App() {
  return (
    <DesignCanvas>
      <Cover/>
      <DCSection id="header" title="1 · Global header · wordmark + endorsement" subtitle="Every screen — the first thing the brand has to land on">
        {headerPair()}
      </DCSection>
      <DCSection id="hero" title="2a · Home hero · the 21-minute promise" subtitle="The single most important brand surface in the product">
        {heroPair()}
      </DCSection>
      <DCSection id="grid" title="2b · Home feed · category tabs + grid" subtitle="What works — porting forward unchanged">
        {gridPair()}
      </DCSection>
      <DCSection id="article" title="2c · Article reader · stepper + time pill" subtitle="Inside the read — keeping the stage flow, fixing the chrome">
        {articlePair()}
      </DCSection>
      <PanelPair/>
      <FlowSection/>
      <NewSurfaces/>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
